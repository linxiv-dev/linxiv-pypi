# Builds platform wheels that bundle the linXiv Rust binaries, then publishes
# to PyPI via trusted publishing. No sdist: this package has no build-from-
# source story (the binaries come from a linXiv GitHub release).
name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      linxiv_tag:
        description: "linXiv release tag to pull binaries from (e.g. v0.2.0)"
        required: true

jobs:
  build-wheels:
    name: wheel (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Convention: this repo's release tag == the linXiv tag whose binaries
      # we bundle, and pyproject.toml's version matches it.
      - name: Resolve linXiv tag and check version sync
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.linxiv_tag }}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$ver" != "$tag" ]; then
            echo "::error::pyproject.toml version ($ver) does not match tag ($tag)"
            exit 1
          fi
          echo "LINXIV_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download linXiv binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src/linxiv/bin
          gh release download "$LINXIV_TAG" -R linxiv-dev/linXiv -D src/linxiv/bin \
            -p "linxiv-app-${{ matrix.triple }}${{ matrix.exe }}" \
            -p "linxiv-cli-${{ matrix.triple }}${{ matrix.exe }}"
          cd src/linxiv/bin
          mv "linxiv-app-${{ matrix.triple }}${{ matrix.exe }}" "linxiv-app${{ matrix.exe }}"
          mv "linxiv-cli-${{ matrix.triple }}${{ matrix.exe }}" "linxiv-cli${{ matrix.exe }}"
          chmod +x linxiv-app* linxiv-cli*

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade build wheel
          python -m build --wheel

      # linXiv release binaries are built on ubuntu-22.04 (glibc 2.35).
      - name: Retag Linux wheel as manylinux
        if: runner.os == 'Linux'
        run: python -m wheel tags --remove --platform-tag manylinux_2_35_x86_64 dist/*linux_x86_64.whl

      - name: Run tests against the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python test_linxiv.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.triple }}
          path: dist/*.whl

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build-wheels
    permissions:
      # Mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/linxiv
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
