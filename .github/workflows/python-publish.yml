# Builds platform wheels that bundle the linXiv Rust binaries, then publishes
# to PyPI via trusted publishing. No sdist: this package has no build-from-
# source story (the binaries come from a linXiv GitHub release).
name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      linxiv_tag:
        description: "linXiv release tag to pull binaries from (e.g. v0.2.0)"
        required: true

jobs:
  build-wheels:
    name: wheel (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Convention: this repo's release tag == the linXiv tag whose binaries
      # we bundle, and pyproject.toml's version matches it.
      - name: Resolve linXiv tag and check version sync
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.linxiv_tag }}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$ver" != "$tag" ]; then
            echo "::error::pyproject.toml version ($ver) does not match tag ($tag)"
            exit 1
          fi
          echo "LINXIV_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download linXiv binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          suffix="${{ matrix.triple }}${{ matrix.exe }}"
          mkdir -p src/linxiv/bin
          # Upstream gave these a `raw-` prefix so they sort below the
          # installers on the release page. This job also runs against older
          # tags, which still carry the bare names, so ask for both and take
          # whichever the tag actually has. Unmatched patterns are fine; gh
          # only fails when NO pattern matches.
          gh release download "$LINXIV_TAG" -R linxiv-dev/linXiv -D src/linxiv/bin \
            -p "raw-linxiv-app-$suffix" -p "raw-linxiv-cli-$suffix" \
            -p "linxiv-app-$suffix"     -p "linxiv-cli-$suffix"
          cd src/linxiv/bin
          for tool in app cli; do
            dest="linxiv-$tool${{ matrix.exe }}"
            if   [ -f "raw-linxiv-$tool-$suffix" ]; then mv "raw-linxiv-$tool-$suffix" "$dest"
            elif [ -f "linxiv-$tool-$suffix" ];     then mv "linxiv-$tool-$suffix"     "$dest"
            else
              echo "::error::$LINXIV_TAG has neither raw-linxiv-$tool-$suffix nor linxiv-$tool-$suffix"
              exit 1
            fi
          done
          chmod +x linxiv-app* linxiv-cli*

      # macOS wheels keep the runner's default platform tag (e.g.
      # macosx_14_0_arm64). Assumption: upstream builds on macos-latest with no
      # MACOSX_DEPLOYMENT_TARGET set, so the binaries' minimum OS is whatever
      # that runner's SDK defaults to; we don't inspect the Mach-O load
      # commands here, so we don't claim anything older.
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade build wheel
          python -m build --wheel

      # Derive the manylinux tag from the glibc symbol versions the bundled
      # binaries actually require (ubuntu-22.04 upstream builds -> 2.35), so
      # the tag stays honest if the upstream builder changes.
      # Caveat: manylinux formally also forbids linking non-whitelisted shared
      # libs, and linxiv-app links system GTK 3, WebKitGTK 4.1, libsoup 3 and
      # OpenSSL 3. We keep the glibc-derived tag anyway — linxiv-cli is fully
      # covered by it, and the GUI's extra runtime deps are documented in
      # README.md "Supported platforms".
      - name: Retag Linux wheel as manylinux
        if: runner.os == 'Linux'
        run: |
          glibc=$(objdump -T src/linxiv/bin/linxiv-app src/linxiv/bin/linxiv-cli \
            | grep -o 'GLIBC_[0-9]*\.[0-9]*' | sort -Vu | tail -1)
          ver=${glibc#GLIBC_}
          tag="manylinux_${ver//./_}_x86_64"
          echo "Measured glibc floor: $glibc -> $tag"
          python -m wheel tags --remove --platform-tag "$tag" dist/*linux_x86_64.whl

      - name: Run tests against the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python test_linxiv.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.triple }}
          path: dist/*.whl

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build-wheels
    permissions:
      # Mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/linxiv
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
